<!doctype html><meta charset=utf-8><title>Trail Planner</title>
<style>#map{position:relative;overflow:hidden}.leaflet-pane,.leaflet-pane>*,.leaflet-tile,.leaflet-top{position:absolute;left:0;top:0;transform-origin:0 0}
.leaflet-tile{width:256px;height:256px;visibility:hidden}.leaflet-tile-loaded{visibility:inherit}.leaflet-pane{z-index:400}.leaflet-tile-pane{z-index:200}.leaflet-top{z-index:1000}.leaflet-bottom{display:none}.leaflet-control-zoom a{display:block;width:30px;text-align:center;background:#fff}.leaflet-tooltip{background:#fff;white-space:nowrap}</style>
<script src=https://unpkg.com/leaflet@1.9.4/dist/leaflet.js></script>
<p id=out>Click trails to select them. Click the map to set a start.</p>
<div id=map style="height:85vh"></div>
<script>
const out = document.getElementById('out'), map = L.map('map', {renderer: L.canvas({tolerance: 6}), zoomAnimation: false});
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
const segs = [], adj = new Map(), sel = new Set(), pt = {}, ll = n => [pt[n][1], pt[n][0]];
const push = (m, k, v) => (m.get(k) || m.set(k, []).get(k)).push(v);
let start = null, startMk = null, routeLine = null;

fetch('trails.geojson').then(r => r.json()).then(load).catch(() => {
  out.innerHTML = 'Choose trails.geojson: <input type=file>';
  out.firstElementChild.onchange = e => e.target.files[0].text().then(t => { out.textContent = 'Click trails to select them. Click the map to set a start.'; load(JSON.parse(t)); });
});
function load(g) {
  // build a network: shared vertices are junctions, each trail piece between junctions is a segment
  const nb = new Map(), K = c => c[0] + ',' + c[1], done = new Set(), E = (a, b) => a < b ? a + '|' + b : b + '|' + a;
  for (const f of g.features) for (const p of f.geometry.type == 'LineString' ? [f.geometry.coordinates] : f.geometry.coordinates)
    for (let i = 1; i < p.length; i++) {
      const a = K(p[i - 1]), b = K(p[i]), name = f.properties.Label || f.properties.Name || 'Unnamed';
      pt[a] = p[i - 1]; pt[b] = p[i];
      if (a != b) for (const [x, y] of [[a, b], [b, a]]) (nb.get(x) || nb.set(x, new Map()).get(x)).set(y, name);
    }
  const walk = (prev, cur) => {
    const path = [prev];
    for (;;) {
      done.add(E(prev, cur)); path.push(cur);
      const nx = nb.get(cur).size == 2 && [...nb.get(cur).keys()].find(n => !done.has(E(cur, n)));
      if (!nx) break; prev = cur; cur = nx;
    }
    const c = path.map(k => pt[k]), s = {id: segs.length, a: path[0], b: cur, c, name: nb.get(path[0]).get(path[1]),
      len: c.reduce((t, p, i) => i ? t + map.distance([p[1], p[0]], [c[i - 1][1], c[i - 1][0]]) : 0, 0)};
    s.line = L.polyline(c.map(p => [p[1], p[0]]), {color: 'gray', weight: 4}).bindTooltip(s.name).addTo(map).on('click', e => {
      L.DomEvent.stopPropagation(e);
      sel.has(s.id) ? sel.delete(s.id) : sel.add(s.id);
      s.line.setStyle({color: sel.has(s.id) ? 'blue' : 'gray'}); solve();
    });
    push(adj, s.a, s); push(adj, s.b, s); segs.push(s);
  };
  for (const pass of [true, false]) for (const [a, n] of nb) if (!pass || n.size != 2) for (const b of n.keys()) if (!done.has(E(a, b))) walk(a, b);
  map.fitBounds(L.featureGroup(segs.map(s => s.line)).getBounds());
}

map.on('click', e => {
  start = [...adj.keys()].reduce((a, b) => e.latlng.distanceTo(ll(a)) < e.latlng.distanceTo(ll(b)) ? a : b);
  startMk?.remove(); startMk = L.circleMarker(ll(start), {color: 'green'}).addTo(map); solve();
});

function dijkstra(src) {
  const D = new Map(src.map(n => [n, 0])), P = new Map(), Q = new Set(src);
  while (Q.size) {
    const u = [...Q].reduce((a, b) => D.get(a) < D.get(b) ? a : b); Q.delete(u);
    for (const s of adj.get(u)) { const v = s.a == u ? s.b : s.a, d = D.get(u) + s.len; if (d < (D.get(v) ?? 1 / 0)) { D.set(v, d); P.set(v, s); Q.add(v); } }
  }
  return {D, P};
}
const pathTo = (P, v) => { const r = []; for (let s; s = P.get(v); v = s.a == v ? s.b : s.a) r.push(s); return r; };

// shortest route covering every selected segment: connect pieces, pair odd junctions, walk an Euler tour
function solve() {
  routeLine?.remove();
  const R = segs.filter(s => sel.has(s.id)); if (!R.length) return out.textContent = 'Nothing selected.';
  const st = start ?? R[0].a, use = [...R], tree = new Set([st]);
  const grow = () => { for (let ch = true; ch;) { ch = false; for (const s of use) if (tree.has(s.a) != tree.has(s.b)) { tree.add(s.a); tree.add(s.b); ch = true; } } };
  for (grow(); ; grow()) {
    const left = R.flatMap(s => tree.has(s.a) ? [] : [s.a, s.b]); if (!left.length) break;
    const {D, P} = dijkstra([...tree]), v = left.reduce((a, b) => (D.get(a) ?? 1 / 0) <= (D.get(b) ?? 1 / 0) ? a : b);
    if (!D.has(v)) return out.textContent = 'Some selected trails cannot be reached.';
    for (const s of pathTo(P, v)) { use.push(s); tree.add(s.a); tree.add(s.b); }
  }
  const deg = new Map(); for (const s of use) for (const n of [s.a, s.b]) deg.set(n, (deg.get(n) || 0) + 1);
  const odd = [...deg.keys()].filter(n => deg.get(n) % 2);
  while (odd.length) {
    const u = odd.pop(), {D, P} = dijkstra([u]), v = odd.reduce((a, b) => D.get(a) <= D.get(b) ? a : b);
    odd.splice(odd.indexOf(v), 1); use.push(...pathTo(P, v));
  }
  const A = new Map(), used = new Set(), stack = [[st, -1]], tour = [];
  use.forEach((s, i) => { push(A, s.a, i); push(A, s.b, i); });
  while (stack.length) {
    const l = A.get(stack.at(-1)[0]); while (l.length && used.has(l.at(-1))) l.pop();
    if (l.length) { const i = l.pop(), s = use[i]; used.add(i); stack.push([s.a == stack.at(-1)[0] ? s.b : s.a, i]); }
    else { const [, i] = stack.pop(); if (i >= 0) tour.push(i); }
  }
  let cur = st; const line = [], names = [];
  for (const i of tour.reverse()) {
    const s = use[i], fwd = s.a == cur; cur = fwd ? s.b : s.a;
    line.push(...(fwd ? s.c : [...s.c].reverse()).map(p => [p[1], p[0]]));
    if (names.at(-1) != s.name) names.push(s.name);
  }
  routeLine = L.polyline(line, {color: 'red', weight: 2, interactive: false}).addTo(map);
  const mi = list => (list.reduce((t, s) => t + s.len, 0) / 1609.344).toFixed(2);
  out.textContent = `Route: ${mi(use)} mi (selected: ${mi(R)} mi). ${names.join(' → ')}`;
}
</script>
